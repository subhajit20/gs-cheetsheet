<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bilingual (English + বাংলা) General Studies cheat sheets for government job exams." />
    <meta name="theme-color" content="#4f46e5" />
    <title>GS Cheat Sheets · English + বাংলা</title>
    <script>
      // Apply saved theme/language before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('gs.theme') || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.lang = localStorage.getItem('gs.lang') || 'both'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
